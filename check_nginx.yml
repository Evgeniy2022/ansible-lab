---
- name: Check nginx health
  hosts: managed
  become: true

  tasks:
    - name: Get nginx HTTP status
      ansible.builtin.uri:
        url: http://localhost
        status_code: 200
      register: http_result
      changed_when: false
      failed_when: http_result.status != 200

    - name: Show result
      ansible.builtin.debug:
        msg: "HTTP status: {{ http_result.status }}"
